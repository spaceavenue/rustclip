[build]
target = "x86_64-unknown-linux-musl"

[unstable]
build-std = ["core", "panic_abort"]
build-std-features = ["optimize_for_size"]

[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static", "-Z", "location-detail=none", "-Z", "fmt-debug=none", "-C", "force-unwind-tables=no", "-C", "link-arg=-Wl,-z,norelro", "-C", "link-arg=-Wl,--gc-sections",]
