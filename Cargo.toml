cargo-features = ["panic-immediate-abort"]

[package]
name = "rustclip"
version = "1.0.0"
edition = "2024"
description = "A wl-clipboard like utility."

[dependencies]
libc = { version = "0.2.186", default-features = false }
rustix = { version = "1.1.5", default-features = false, features = ["fs", "mm", "pipe", "process", "stdio"] }
wllib = { git = "https://github.com/spaceavenue/wllib.git" }

[[bin]]
name = "wl-paste"
path = "src/wl-paste.rs"
[[bin]]
name = "wl-watch"
path = "src/wl-watch.rs"
[[bin]]
name = "wl-copy"
path = "src/wl-copy.rs"

[profile.dev]
panic = "immediate-abort"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "immediate-abort"
